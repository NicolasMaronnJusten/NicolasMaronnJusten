<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">Dados, sistemas e código</title>
  <desc id="desc">Capa com uma janela de código Python e referências a desenvolvimento web e SQL.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#091221"/>
      <stop offset="1" stop-color="#182449"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1b2942"/>
      <stop offset="1" stop-color="#10192d"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#53688e" stroke-opacity=".25"/>
    </pattern>
    <clipPath id="edges">
      <rect width="1120" height="300" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#edges)">
    <rect width="1120" height="300" fill="url(#background)"/>
    <path d="M604 0H1120V300H505Z" fill="url(#grid)"/>
    <path d="M620 0 510 300" fill="none" stroke="#344667"/>
    <path d="M503 0V77L531 105H619M1120 201H1029L991 239H968M612 300V244L637 219H680M976 0V43L1004 71H1084V112" fill="none" stroke="#586a96" stroke-width="1.5"/>
    <circle cx="531" cy="105" r="4" fill="#a9a5ff"/>
    <circle cx="637" cy="219" r="4" fill="#60edc1"/>
    <circle cx="1084" cy="112" r="4" fill="#60edc1"/>
    <circle cx="991" cy="239" r="4" fill="#a9a5ff"/>

    <g font-family="ui-monospace, Consolas, monospace">
      <rect x="56" y="48" width="20" height="3" rx="1.5" fill="#60edc1"/>
      <text x="88" y="56" fill="#bfcae1" font-size="16" font-weight="700" letter-spacing="2">CIÊNCIA DA COMPUTAÇÃO</text>
    </g>
    <g font-family="system-ui, Segoe UI, sans-serif" font-size="56" font-weight="750" letter-spacing="-1.7">
      <text x="54" y="132" fill="#f4f7ff">Dados, sistemas</text>
      <text x="54" y="194" fill="#60edc1">e código.</text>
    </g>

    <g font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="700">
      <rect x="56" y="229" width="106" height="32" rx="7" fill="#143933" stroke="#31816e"/>
      <text x="109" y="250" text-anchor="middle" fill="#a1f5da">PYTHON</text>
      <rect x="172" y="229" width="74" height="32" rx="7" fill="#2b294d" stroke="#605e8a"/>
      <text x="209" y="250" text-anchor="middle" fill="#d0caff">WEB</text>
      <rect x="256" y="229" width="74" height="32" rx="7" fill="#2b294d" stroke="#605e8a"/>
      <text x="293" y="250" text-anchor="middle" fill="#d0caff">SQL</text>
    </g>

    <rect x="631" y="61" width="400" height="176" rx="14" fill="#060c19" opacity=".48"/>
    <rect x="622" y="52" width="400" height="176" rx="14" fill="url(#window)" stroke="#526486"/>
    <path d="M622 91H1022" stroke="#465777"/>
    <circle cx="644" cy="72" r="4" fill="#f4a5b2"/>
    <circle cx="658" cy="72" r="4" fill="#f8ce91"/>
    <circle cx="672" cy="72" r="4" fill="#60edc1"/>
    <g font-family="ui-monospace, Consolas, monospace" font-size="17">
      <text x="999" y="78" text-anchor="end" fill="#aab8d6" font-size="13" letter-spacing="1">DADOS.PY</text>
      <g fill="#a0aecb" font-size="14">
        <text x="643" y="123">01</text>
        <text x="643" y="152">02</text>
        <text x="643" y="181">03</text>
      </g>
      <text x="677" y="124" fill="#e9f0ff"><tspan fill="#c4b7ff">def</tspan> <tspan fill="#85f0cf">resumir</tspan>(registros):</text>
      <text x="701" y="153" fill="#e9f0ff"><tspan fill="#c4b7ff">return</tspan> len(registros)</text>
      <path d="M677 174l4 4-4 4" fill="none" stroke="#60edc1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="691" y="174" width="9" height="10" rx="1" fill="#60edc1"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1119" height="299" rx="23.5" fill="none" stroke="#394a6e"/>
</svg>
